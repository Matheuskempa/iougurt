version: "3.9"

services:
  backend:
    build: ./backend
    container_name: iougurt_api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://iougurt_user:iougurt_pass@db:5432/iougurt_db
    volumes:
      - ./backend/app:/app/app

  db:
    image: postgres:15
    container_name: iougurt_db
    restart: always
    environment:
      POSTGRES_USER: iougurt_user
      POSTGRES_PASSWORD: iougurt_pass
      POSTGRES_DB: iougurt_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

volumes:
  pgdata:
